[project]
name = "model-flow-worker"
version = "0.1.0"
description = "ModelFlow ML worker: profiling + training pipeline"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "openpyxl>=3.1",
    "pyarrow>=16.0",
    "supabase>=2.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "fastapi>=0.114",
    "uvicorn[standard]>=0.30",
    "joblib>=1.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"